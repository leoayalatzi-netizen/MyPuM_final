name: Generate MyPuM Upload Key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-key:
    runs-on: ubuntu-latest

    steps:
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate upload key
        run: |
          set -e

          mkdir -p signing

          KEYSTORE_PASSWORD="$(openssl rand -base64 32)"
          KEY_PASSWORD="$(openssl rand -base64 32)"

          keytool -genkeypair \
            -v \
            -keystore signing/mypum-upload-key.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias mypum_upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=MyPuM, OU=Software, O=MyPuM, L=Mexico, ST=Jalisco, C=MX"

          test -s signing/mypum-upload-key.jks

          cat > signing/credentials.txt <<EOF
          MYPUM_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD
          MYPUM_KEY_PASSWORD=$KEY_PASSWORD
          MYPUM_KEY_ALIAS=mypum_upload
          EOF

          echo "Keystore generado correctamente."

      - name: Upload signing files
        uses: actions/upload-artifact@v4
        with:
          name: MyPuM-upload-key
          path: signing/
          if-no-files-found: error
          retention-days: 1
