name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-

      - name: Build debug APK
        shell: bash
        run: |
          set +e

          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon \
            --console=plain \
            2>&1 | tee build.log

          STATUS=${PIPESTATUS[0]}

          echo ""
          echo "============================================================"
          echo "                 RESULTADO DE COMPILACIÓN"
          echo "============================================================"

          if [ "$STATUS" -eq 0 ]; then
            echo "✅ BUILD EXITOSO"
          else
            echo "❌ BUILD FALLIDO"
            echo ""
            echo "================ ERRORES KOTLIN ================="

            grep -nE "\.kt:[0-9]+:[0-9]+" build.log || true

            echo ""
            echo "================ MENSAJES DEL COMPILADOR ================="

            grep -nE "(^e:|^w:|error:|warning:|Expecting |Unexpected |Type expected|Property getter|Unresolved reference|Type mismatch|Cannot access|Overload resolution ambiguity)" build.log || true

            echo ""
            echo "================ CONTEXTO DE ERRORES ================="

            grep -nE -B 2 -A 4 "\.kt:[0-9]+:[0-9]+" build.log || true

            echo ""
            echo "================ ARCHIVOS .KT CON ERROR ================="

            grep -nE \
              'e: file:///.*\.kt:[0-9]+:[0-9]+' \
              build.log || true

            echo ""
            echo "================ ÚLTIMAS 100 LÍNEAS ================="

            tail -n 100 build.log

            echo ""
            echo "============================================================"
            echo "              FIN DEL DIAGNÓSTICO"
            echo "============================================================"
          fi

          echo "## Resultado de compilación" >> "$GITHUB_STEP_SUMMARY"

          if [ "$STATUS" -eq 0 ]; then
            echo "### ✅ BUILD EXITOSO" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ BUILD FALLIDO" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Errores Kotlin" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"

            grep -nE \
              '(^e: |error:|Unresolved reference:|Type mismatch:|Cannot access |Expecting |Overload resolution ambiguity|This declaration is not allowed|None of the following functions)' \
              build.log >> "$GITHUB_STEP_SUMMARY" || true

            echo '```' >> "$GITHUB_STEP_SUMMARY"

            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Archivos Kotlin afectados" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"

            grep -nE \
              'e: file:///.*\.kt:[0-9]+:[0-9]+' \
              build.log >> "$GITHUB_STEP_SUMMARY" || true

            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

          exit "$STATUS"

      - name: Upload compilation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: build.log
          if-no-files-found: ignore
