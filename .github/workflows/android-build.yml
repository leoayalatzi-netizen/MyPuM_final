name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build MyPuM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Show project information
        run: |
          echo "=== COMMIT ==="
          git rev-parse HEAD

          echo "=== GRADLE ==="
          ./gradlew --version

          echo "=== PROJECT ==="
          find app/src/main -type f | sort | head -100

      - name: Clean
        run: |
          ./gradlew clean \
            --stacktrace \
            --no-daemon

      - name: Build Debug APK
        run: |
          set -o pipefail

          ./gradlew assembleDebug \
            --stacktrace \
            --info \
            --no-daemon \
            2>&1 | tee build.log

      - name: Locate APK
        if: always()
        run: |
          echo "=== APK FILES ==="

          find . \
            -type f \
            -name "*.apk" \
            -not -path "./.git/*" \
            -print \
            | sort

          echo
          echo "=== APP BUILD DIRECTORY ==="

          if [ -d app/build ]; then
            find app/build -maxdepth 5 -type f | sort
          else
            echo "app/build NO EXISTE"
          fi

      - name: Verify APK exists
        run: |
          APK="$(find app/build -type f -name "*.apk" | head -n 1)"

          if [ -z "$APK" ]; then
            echo "::error::Gradle terminó sin generar ningún APK."
            echo "Revisa el build.log anterior."
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

      - name: Prepare APK
        run: |
          mkdir -p artifacts

          APK="$(find app/build -type f -name "*.apk" | head -n 1)"

          cp "$APK" artifacts/MyPuM-debug.apk

          ls -lh artifacts/MyPuM-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyPuM-debug-apk
          path: artifacts/MyPuM-debug.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MyPuM-build-log
          path: build.log
          if-no-files-found: warn
