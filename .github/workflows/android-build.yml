name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MyPuM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify toolchain
        run: |
          echo "=== JAVA ==="
          java -version

          echo
          echo "=== SDK ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo
          echo "=== SDKMANAGER ==="
          sdkmanager --version

          echo
          echo "=== GRADLE ==="
          chmod +x ./gradlew
          ./gradlew --version

      - name: Build Debug APK
        id: build
        shell: bash
        run: |
          set -o pipefail

          ./gradlew assembleDebug \
            --stacktrace \
            --info \
            --no-daemon \
            2>&1 | tee build.log

      - name: Locate APK
        if: always()
        run: |
          echo "=== APK FILES ==="

          find . \
            -type f \
            -name "*.apk" \
            -not -path "./.git/*" \
            -print \
            | sort

          echo
          echo "=== APP BUILD ==="

          if [ -d app/build ]; then
            find app/build -maxdepth 6 -type f | sort
          else
            echo "app/build NO EXISTE"
          fi

      - name: Prepare APK
        if: success()
        run: |
          set -e

          APK="$(find app/build -type f -name "*.apk" | head -n 1)"

          if [ -z "$APK" ]; then
            echo "::error::Gradle terminó correctamente pero no se encontró ningún APK."
            exit 1
          fi

          mkdir -p artifacts

          cp "$APK" artifacts/MyPuM-debug.apk

          echo
          echo "=== APK FINAL ==="
          ls -lh artifacts/MyPuM-debug.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MyPuM-debug-apk
          path: artifacts/MyPuM-debug.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MyPuM-build-log
          path: build.log
          if-no-files-found: warn
