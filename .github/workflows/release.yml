name: MyPuM Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Setup upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.MYPUM_KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secret MYPUM_KEYSTORE_BASE64"
            exit 1
          fi

          mkdir -p signing

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > signing/mypum-upload-key.jks

          test -s signing/mypum-upload-key.jks

          echo "Keystore preparado."

      - name: Build signed AAB
        env:
          MYPUM_KEYSTORE_FILE: ${{ github.workspace }}/signing/mypum-upload-key.jks
          MYPUM_KEYSTORE_PASSWORD: ${{ secrets.MYPUM_KEYSTORE_PASSWORD }}
          MYPUM_KEY_PASSWORD: ${{ secrets.MYPUM_KEY_PASSWORD }}
          MYPUM_KEY_ALIAS: ${{ secrets.MYPUM_KEY_ALIAS }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease

      - name: Prepare artifact
        run: |
          set -e

          mkdir -p artifacts

          cp app/build/outputs/bundle/release/app-release.aab \
             artifacts/MyPuM-release.aab

          test -s artifacts/MyPuM-release.aab

          echo "AAB firmado generado correctamente."

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: MyPuM-release-aab
          path: artifacts/MyPuM-release.aab
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup signing key
        if: always()
        run: |
          rm -rf signing
