name: MyPuM Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK components
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0"

      - name: Setup upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.MYPUM_KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secret MYPUM_KEYSTORE_BASE64"
            exit 1
          fi

          mkdir -p signing

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > signing/mypum-upload-key.jks

          test -s signing/mypum-upload-key.jks

          echo "Keystore preparado."

      - name: Convert launcher images to valid PNG
        run: |
          mkdir -p /tmp/mypum-image-converter

          cat > /tmp/mypum-image-converter/ConvertImages.java <<'JAVA'
          import java.awt.image.BufferedImage;
          import java.io.File;
          import javax.imageio.ImageIO;

          public class ConvertImages {
              public static void main(String[] args) throws Exception {
                  for (String path : args) {
                      File file = new File(path);

                      BufferedImage image = ImageIO.read(file);

                      if (image == null) {
                          throw new RuntimeException(
                              "No se pudo leer la imagen: " + path
                          );
                      }

                      File temp = new File(path + ".converted.png");

                      if (!ImageIO.write(image, "PNG", temp)) {
                          throw new RuntimeException(
                              "No se pudo escribir PNG: " + path
                          );
                      }

                      if (!temp.renameTo(file)) {
                          throw new RuntimeException(
                              "No se pudo reemplazar: " + path
                          );
                      }

                      System.out.println(
                          "Convertido a PNG: " + path +
                          " (" + image.getWidth() + "x" +
                          image.getHeight() + ")"
                      );
                  }
              }
          }
          JAVA

          javac /tmp/mypum-image-converter/ConvertImages.java

          java             -Djava.awt.headless=true             -cp /tmp/mypum-image-converter             ConvertImages             app/src/main/res/mipmap-mdpi/ic_launcher.png             app/src/main/res/mipmap-mdpi/ic_launcher_round.png             app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          file             app/src/main/res/mipmap-mdpi/ic_launcher.png             app/src/main/res/mipmap-mdpi/ic_launcher_round.png             app/src/main/res/mipmap-xxhdpi/ic_launcher.png

      - name: Build signed AAB
        env:
          MYPUM_KEYSTORE_FILE: ${{ github.workspace }}/signing/mypum-upload-key.jks
          MYPUM_KEYSTORE_PASSWORD: ${{ secrets.MYPUM_KEYSTORE_PASSWORD }}
          MYPUM_KEY_PASSWORD: ${{ secrets.MYPUM_KEY_PASSWORD }}
          MYPUM_KEY_ALIAS: ${{ secrets.MYPUM_KEY_ALIAS }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease

      - name: Prepare artifact
        run: |
          set -e

          mkdir -p artifacts

          cp app/build/outputs/bundle/release/app-release.aab \
             artifacts/MyPuM-release.aab

          test -s artifacts/MyPuM-release.aab

          echo "AAB firmado generado correctamente."

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: MyPuM-release-aab
          path: artifacts/MyPuM-release.aab
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup signing key
        if: always()
        run: |
          rm -rf signing
