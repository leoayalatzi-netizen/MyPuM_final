name: MyPuM Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK components
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0"

      - name: Setup upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.MYPUM_KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secret MYPUM_KEYSTORE_BASE64"
            exit 1
          fi

          mkdir -p signing

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > signing/mypum-upload-key.jks

          test -s signing/mypum-upload-key.jks

          echo "Keystore preparado."

      - name: Convert launcher images to valid PNG
        run: |
          mkdir -p /tmp/mypum-image-converter

          cat > /tmp/mypum-image-converter/ConvertImages.java <<'JAVA'
          import java.awt.image.BufferedImage;
          import java.io.File;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.nio.file.StandardCopyOption;
          import javax.imageio.ImageIO;

          public class ConvertImages {
              public static void main(String[] args) throws Exception {
                  for (String path : args) {
                      File file = new File(path);

                      BufferedImage image = ImageIO.read(file);

                      if (image == null) {
                          throw new RuntimeException(
                              "No se pudo leer la imagen: " + path
                          );
                      }

                      Path target = file.toPath();
                      Path temp = Path.of(path + ".converted.png");

                      if (!ImageIO.write(image, "PNG", temp.toFile())) {
                          throw new RuntimeException(
                              "No se pudo escribir PNG: " + path
                          );
                      }

                      Files.move(
                          temp,
                          target,
                          StandardCopyOption.REPLACE_EXISTING
                      );

                      System.out.println(
                          "Convertido a PNG: " + path +
                          " (" + image.getWidth() + "x" +
                          image.getHeight() + ")"
                      );
                  }
              }
          }
          JAVA

          javac /tmp/mypum-image-converter/ConvertImages.java

          find app/src/main/res -type f \
            \( -name "ic_launcher.png" -o -name "ic_launcher_round.png" \) \
            -print0 > /tmp/mypum-launcher-images.txt

          if [ ! -s /tmp/mypum-launcher-images.txt ]; then
            echo "::error::No se encontraron iconos launcher."
            exit 1
          fi

          while IFS= read -r -d '' image; do
            java \
              -Djava.awt.headless=true \
              -cp /tmp/mypum-image-converter \
              ConvertImages \
              "$image"
          done < /tmp/mypum-launcher-images.txt

          echo "Verificando firmas PNG..."

          while IFS= read -r -d '' image; do
            if ! head -c 8 "$image" | od -An -tx1 | grep -q "89 50 4e 47 0d 0a 1a 0a"; then
              echo "::error::El archivo no terminó como PNG válido: $image"
              exit 1
            fi

            file "$image"
          done < /tmp/mypum-launcher-images.txt

          echo "Todos los iconos launcher son PNG válidos."

      - name: Validate signing key
        env:
          MYPUM_KEYSTORE_PASSWORD: ${{ secrets.MYPUM_KEYSTORE_PASSWORD }}
          MYPUM_KEY_ALIAS: ${{ secrets.MYPUM_KEY_ALIAS }}
        run: |
          set -e

          echo "Validando keystore y alias..."

          keytool -list \
            -keystore signing/mypum-upload-key.jks \
            -storepass "$MYPUM_KEYSTORE_PASSWORD" \
            -alias "$MYPUM_KEY_ALIAS" \
            >/tmp/mypum-keystore-check.txt

          echo "Keystore y alias válidos."

      - name: Build signed AAB
        env:
          MYPUM_KEYSTORE_FILE: ${{ github.workspace }}/signing/mypum-upload-key.jks
          MYPUM_KEYSTORE_PASSWORD: ${{ secrets.MYPUM_KEYSTORE_PASSWORD }}
          MYPUM_KEY_PASSWORD: ${{ secrets.MYPUM_KEY_PASSWORD }}
          MYPUM_KEY_ALIAS: ${{ secrets.MYPUM_KEY_ALIAS }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease

      - name: Prepare artifact
        run: |
          set -e

          mkdir -p artifacts

          cp app/build/outputs/bundle/release/app-release.aab \
             artifacts/MyPuM-release.aab

          test -s artifacts/MyPuM-release.aab

          echo "AAB firmado generado correctamente."

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: MyPuM-release-aab
          path: artifacts/MyPuM-release.aab
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup signing key
        if: always()
        run: |
          rm -rf signing
